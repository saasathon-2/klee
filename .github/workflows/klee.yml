name: klee

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_run:
        types: [completed]

permissions:
    id-token: write

jobs:
    generate-artefact:
        if: github.event_name == 'pull_request' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.name != 'klee' && github.event.workflow_run.pull_requests[0].number)
        runs-on: ubuntu-latest
        steps:
            - uses: saasathon-2/integrations/github@main
              with:
                  api-url: https://api-production-50e54.up.railway.app
                  pull-request: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
