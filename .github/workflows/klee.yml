name: klee

on:
    pull_request:
        types: [opened, synchronize, reopened]
    # Forked PRs require manual approval for `pull_request` workflows. This job
    # only sends the PR number to Klee and never checks out or runs PR code.
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    id-token: write

jobs:
    migration-guard:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node backend/scripts/migrations-check.mjs
              env:
                  MIGRATIONS_BASE_REF: origin/${{ github.base_ref }}

    generate-artefact:
        if: github.event_name == 'pull_request' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork)
        runs-on: ubuntu-latest
        steps:
            - uses: saasathon-2/integrations/github@main
              with:
                  api-url: https://klee.work
                  pull-request: ${{ github.event.pull_request.number }}
