name: Klee

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    id-token: write

jobs:
    klee:
        needs: [migration-guard]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: saasathon-2/integrations/github@main
              with:
                  api-url: https://klee.work
                  pull-request: ${{ github.event.pull_request.number }}
