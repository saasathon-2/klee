name: klee

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    id-token: write

jobs:
    migration-guard:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node backend/scripts/migrations-check.mjs
              env:
                  MIGRATIONS_BASE_REF: origin/${{ github.base_ref }}

    generate-artefact:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: saasathon-2/integrations/github@main
              with:
                  api-url: https://api-production-50e54.up.railway.app
                  pull-request: ${{ github.event.pull_request.number }}
